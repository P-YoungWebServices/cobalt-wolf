# OneClick Media Suite — generated stack.
# Versions pinned to latest stable releases verified 2026-11-12; bump by editing
# the tag and running `docker compose pull && docker compose up -d`.
name: oneclick-media-suite

networks:
  mediasuite:
    name: mediasuite
    # Fixed subnet so gluetun's FIREWALL_OUTBOUND_SUBNETS can always allow it:
    # VPN-side containers (Prowlarr) must reach the bridge-side apps (Radarr,
    # Sonarr) or app registration fails.
    ipam:
      config:
        - subnet: 10.97.0.0/24

services:
  # ---------- VPN gateway ----------
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: gluetun
    hostname: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      mediasuite:
        ipv4_address: 10.97.0.2
    # Ports for every container that shares gluetun's network live HERE.
    ports:
      - "8080:8080"   # qBittorrent WebUI
      - "9696:9696"   # Prowlarr
    env_file: [.env]
    environment:
      VPN_SERVICE_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_TYPE: ${VPN_TYPE}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING}
      VPN_PORT_FORWARDING_PROVIDER: ${VPN_SERVICE_PROVIDER}
      VPN_PORT_FORWARDING_STATUS_FILE: /gluetun/forwarded_port
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_PRESHARED_KEY: ${WIREGUARD_PRESHARED_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY}
      # .env emits only the pair matching VPN_TYPE (empty = unset to gluetun)
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT:-}
      OPENVPN_ENDPOINT_IP: ${OPENVPN_ENDPOINT_IP:-}
      OPENVPN_ENDPOINT_PORT: ${OPENVPN_ENDPOINT_PORT:-}
      SERVER_HOSTNAMES: ${SERVER_HOSTNAMES}
      OPENVPN_USER: ${OPENVPN_USER}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD}
      OPENVPN_CUSTOM_CONFIG: /gluetun/custom.ovpn
      FIREWALL_OUTBOUND_SUBNETS: ${FIREWALL_OUTBOUND_SUBNETS}
      HEALTH_TARGET_ADDRESSES: github.com:443
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    restart: unless-stopped

  # ---------- download client (behind VPN) ----------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8080"
    volumes:
      - ${CONFIG_DIR}/qbittorrent:/config
      - ${DATA_DIR}/torrents:/data/torrents
    labels:
      deunhealth.restart.on.unhealthy: "true"
    # Healthy = gluetun alive AND real outbound via the tunnel. If gluetun is
    # recreated this container's netns goes stale (loopback only) and the
    # :9999 probe fails fast; if the tunnel drops, the outbound probe fails.
    # Either way deunhealth restarts the container onto a healthy gluetun.
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:9999 && wget -q -O /dev/null --timeout=10 https://api.ipify.org"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ---------- indexer manager (behind VPN) ----------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0
    container_name: prowlarr
    network_mode: service:gluetun
    depends_on: [gluetun]
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    labels:
      deunhealth.restart.on.unhealthy: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://127.0.0.1:9999 && wget -q -O /dev/null --timeout=10 https://api.ipify.org"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # ---------- syncs the VPN-forwarded port into qBittorrent ----------
  portforward-sync:
    build:
      context: ./portforward-sync
    image: ocms-portforward-sync:local
    container_name: portforward-sync
    network_mode: service:gluetun
    depends_on: [qbittorrent]
    environment:
      QBIT_USER: ${QBIT_USER}
      QBIT_PASS: ${QBIT_PASS}
    volumes:
      - ${CONFIG_DIR}/gluetun:/state:ro
    labels:
      deunhealth.restart.on.unhealthy: "true"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS --max-time 10 http://127.0.0.1:9999 >/dev/null && curl -fsS --max-time 10 https://api.ipify.org >/dev/null"]
      interval: 60s
      timeout: 25s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    profiles: [portforward]

  # ---------- media managers ----------
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    networks:
      mediasuite:
        ipv4_address: 10.97.0.5
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    networks:
      mediasuite:
        ipv4_address: 10.97.0.4
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: bazarr
    networks:
      mediasuite:
        ipv4_address: 10.97.0.6
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${CONFIG_DIR}/bazarr:/config
      - ${DATA_DIR}/media:/data/media
    ports:
      - "6767:6767"
    restart: unless-stopped

  # ---------- media server ----------
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    networks:
      mediasuite:
        ipv4_address: 10.97.0.3
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      JELLYFIN_PublishedServerUrl: ${JELLYFIN_PUBLISHED_URL}
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${CONFIG_DIR}/jellyfin-cache:/cache
      - ${DATA_DIR}/media:/data/media:ro
    ports:
      - "8096:8096"
      # Uncomment for local DLNA / client auto-discovery broadcasts:
      # - "1900:1900/udp"
      # - "7359:7359/udp"
    # Uncomment for Intel/AMD hardware transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

  # ---------- requests ----------
  seerr:
    image: seerr/seerr:v3.5.1
    container_name: seerr
    networks:
      mediasuite:
        ipv4_address: 10.97.0.7
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
      PORT: "5055"
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  # ---------- dashboard: service tiles + live stats, behind the admin password ----------
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.4.5
    container_name: homepage
    networks:
      mediasuite:
        ipv4_address: 10.97.0.8
    environment:
      TZ: ${TZ}
      HOMEPAGE_ALLOWED_HOSTS: ${HOST_IP},localhost,127.0.0.1
    volumes:
      - ${CONFIG_DIR}/homepage:/app/config
    restart: unless-stopped

  # auth proxy: the only way to reach homepage is through here, past the
  # Jellyfin admin credentials
  dashboard:
    image: nginx:1.30.6-alpine
    container_name: dashboard
    networks:
      mediasuite:
        ipv4_address: 10.97.0.9
    ports:
      - "3080:3080"
    volumes:
      - ${CONFIG_DIR}/dashboard/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${CONFIG_DIR}/dashboard/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on: [homepage]
    restart: unless-stopped

  # ---------- restarts containers when the VPN bounces ----------
  deunhealth:
    image: qmcgaw/deunhealth:latest
    container_name: deunhealth
    networks:
      mediasuite:
        ipv4_address: 10.97.0.10
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
