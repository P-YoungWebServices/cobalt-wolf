name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Gradle project arrives with the M1 scaffold. Until then there is
      # no gradlew/settings.gradle, so skip cleanly instead of failing.
      - name: Check for Gradle project
        id: gradle-check
        run: |
          if [ -f gradlew ] && [ -f settings.gradle.kts -o -f settings.gradle ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Gradle project yet; skipping build."
          fi

      - name: Set up JDK 17
        if: steps.gradle-check.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.gradle-check.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        if: steps.gradle-check.outputs.present == 'true'
        run: ./gradlew test assembleDebug
